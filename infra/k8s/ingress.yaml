apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartwms-ingress
spec:
  rules:
    - host: smartwms.local
      http:
        paths:
          - path: /inventory
            pathType: Prefix
            backend:
              service:
                name: inventory-api
                port:
                  number: 80
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  number: 80
          - path: /warehouse
            pathType: Prefix
            backend:
              service:
                name: warehouse-api
                port:
                  number: 80
