apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: database-from-api-only}
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: inventory-api}
        - podSelector:
            matchLabels: {app: inventory-migration}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-from-frontend-only}
spec:
  podSelector:
    matchLabels: {app: inventory-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: frontend}
      ports: [{protocol: TCP, port: 8080}]
