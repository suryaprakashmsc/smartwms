version: "3.9"

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8081:8080"
    volumes:
      - jenkins-data:/var/jenkins_home

  postgres:
    image: postgres:16-alpine
    container_name: smartwms-postgres
    environment:
      POSTGRES_DB: smartwms
      POSTGRES_USER: smartwms
      POSTGRES_PASSWORD: smartwms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: smartwms-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartwms.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: smartwms-redis
    ports:
      - "6379:6379"

volumes:
  jenkins-data:
  postgres-data:
