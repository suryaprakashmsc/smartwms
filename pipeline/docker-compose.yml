version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartwms-db
    environment:
      POSTGRES_USER: smartwms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: inventory
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwms -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-api:
    image: smartwms-inventory:local
    build:
      context: ../src/services/Inventory.API
      dockerfile: API/Dockerfile
    container_name: smartwms-inventory-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=inventory;
        Username=smartwms;Password=${POSTGRES_PASSWORD}
      Cognito__Region: ${COGNITO_REGION}
      Cognito__UserPoolId: ${COGNITO_USER_POOL_ID}
      Cognito__ClientId: ${COGNITO_CLIENT_ID}
      Cognito__Authority: ${COGNITO_AUTHORITY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: smartwms-ui:local
    build:
      context: ../src/frontend/smartwms-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_COGNITO_REGION: ${COGNITO_REGION}
        VITE_COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
        VITE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
        VITE_COGNITO_DOMAIN: ${COGNITO_DOMAIN}
        VITE_REDIRECT_SIGN_IN: ${VITE_REDIRECT_SIGN_IN:-http://localhost:3000/callback}
        VITE_REDIRECT_SIGN_OUT: ${VITE_REDIRECT_SIGN_OUT:-http://localhost:3000/login}
    container_name: smartwms-frontend
    ports:
      - "3000:80"
    depends_on:
      inventory-api:
        condition: service_healthy

  jenkins:
    image: jenkins/jenkins:lts
    container_name: smartwms-jenkins
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

volumes:
  postgres_data:
  jenkins_data:
